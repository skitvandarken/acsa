<!-- TEXTO DE CHAMADA: SOBRE ANGOLA CABLES -->
<div class=" bg-pattern">
  <div class="uk-container uk-margin-large-top uk-margin-large-bottom ">
    <p class="uk-text-center uk-container angola-cables-texto "><span class="angola-cables-titulo "
        style="color:#28C1FD ; font-size: 1.55rem;  ">Angola Cables</span> {{ 'ac.descricao' | translate
      }}</p>
  </div>
</div>

<!-- 2 Colunas | Presença Global & Vídeo Institucional AC -->

<div class="uk-container uk-margin-large-bottom">
  <div class="uk-child-width-1-2@m uk-grid-medium uk-child-width-1-2@s uk-grid-match-height uk-grid uk-text-left">

    <!-- LEFT SIDE -->
    <div class="uk-width-1-2@m uk-margin-small-bottom">
      <div class="uk-text-left">
        <div class="uk-border-rounded fundo-forma">
          <div style="color: #000026; font-size: 1.3rem; margin-left: 10px;" class="presenca-global">
            <img class="uk-margin-small-right" width="55" height="58" src="img/icone-ac.png">
            <b>{{ 'ac.presenca' | translate }}</b>
          </div>
        </div>

        <p style="color: #000026; font-size: 1.1rem;"
          class="sobre-angola-cables uk-margin-small-right uk-margin-medium-top">
          {{ 'ac.presencadescricao' | translate }}



        </p>

        <p class="uk-margin-small-top uk-margin-medium-bottom">
          <a style="font-weight:700; color: #022561;" routerLink="/sobre"> {{ 'mais.sobre' | translate }} </a> <span
            uk-icon="arrow-right"></span>
        </p>
      </div>

      <!-- PRIMARY ACTION 
      <div class="uk-margin-medium-top">
        <a routerLink="/sobre" class="uk-text-decoration-none">
          <button class="botao-azul uk-button uk-button-primary uk-width-1-1 uk-button-medium uk-border-pill">
            {{ 'mais.sobre' | translate }}
          </button>
        </a>
      </div>

      -->

      <!-- SECONDARY ACTIONS -->
      <div class="uk-margin uk-grid-small uk-child-width-1-2@s uk-grid-match uk-text-center" uk-grid>
        <div>
          <a href="#modal-video" uk-toggle class="uk-text-decoration-none">
            <button class="botao uk-button uk-button-default uk-button-medium uk-border-pill uk-width-1-1">
              {{ 'ver.videoinstitucional' | translate }}
            </button>
          </a>
        </div>

        <div>
          <a target="_blank" href="https://www.submarinecablemap.com/landing-point/sangano-angola"
            class="uk-text-decoration-none">
            <button class="botao uk-button uk-button-default uk-button-medium uk-border-pill uk-width-1-1">
              {{ 'ver.mapa' | translate }}
            </button>
          </a>
        </div>
      </div>

      <!-- CABLE LINKS (LIGHT STYLE) -->
      <div class="uk-margin-medium-top uk-text-center">
        <div class="uk-grid-small uk-child-width-1-3@s uk-child-width-1-3@m" uk-grid>
          <div>
            <a routerLink="/sobre" class="uk-text-decoration-none">
              <button class="botao-azul uk-button uk-button-primary uk-width-1-1 uk-button-medium uk-border-pill">
                {{ 'cabo.monet' | translate }}
                <span class="uk-margin-small-left" uk-icon="icon: arrow-up-right"></span>
              </button>

            </a>
          </div>
          <div>
            <a routerLink="/sobre" class="uk-text-decoration-none">
              <button class="botao-azul uk-button uk-button-primary uk-width-1-1 uk-button-medium uk-border-pill">
                {{ 'cabo.sacs' | translate }}
                <span class="uk-margin-small-left" uk-icon="icon: arrow-up-right"></span>
              </button>
            </a>
          </div>
          <div>
            <a routerLink="/sobre" class="uk-text-decoration-none">
             <button class="botao-azul uk-button uk-button-primary uk-width-1-1 uk-button-medium uk-border-pill">
          {{ 'cabo.wacs' | translate }}
          <span class="uk-margin-small-left" uk-icon="icon: arrow-up-right"></span>
        </button>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE (VIDEO) -->
    <div class="uk-width-1-2@m uk-margin-medium-bottom uk-flex uk-flex-center uk-flex-top">
      <div class="uk-text-center">
        <a href="#modal-video" uk-toggle>
          <img src="img/video-miniatura.png" alt="Video Thumbnail" class="uk-border-rounded">
        </a>

        <!-- MODAL -->
        <div id="modal-video" uk-modal>
          <div class="uk-modal-dialog uk-margin-auto-vertical uk-modal-body uk-border-rounded">
            <button class="uk-modal-close-default" type="button" uk-close></button>

            <video controls loop muted id="promoVideo" class="promo-video uk-border-rounded">
              <source src="https://marketing.host2africa.com/files/AC-Angolaoutlook-EN-2025%202-new.mp4"
                type="video/mp4" />
              Seu navegador não suporta o vídeo.
            </video>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
